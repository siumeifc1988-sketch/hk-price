<body class="bg-[#FFFDF5] text-neutral-900 min-h-screen">
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b">

    <div class="flex items-center gap-2"><div id="syncBadge" class="text-[11px] px-2.5 py-1 rounded-full bg-neutral-100 border">連接中...</div><button id="viewToggle" class="hidden md:flex w-8 h-8 rounded-full border bg-white flex items-center justify-center text-[12px]"><i class="fa-solid fa-table"></i></button></div>

<div class="max-w-[1280px] mx-auto md:flex md:gap-6 p-3 md:p-6">

      <div class="grid gap-3">
        <input id="productName" placeholder="產品名 例如：雀巢淡奶 410ml" class="w-full h-[44px] rounded-full border px-4 text-[14px] focus:outline-none focus:border-black">
        <div class="flex gap-2">
          <select id="category" class="flex-1 h-[44px] rounded-full border px-3 text-[13px] bg-white">
            <option value="">🏷️ 選擇種類</option>
            <option value="飲品">🥤 飲品</option><option value="奶類">🥛 奶類/豆奶</option><option value="罐頭醬料">🥫 罐頭/醬料</option><option value="米麵粉">🍚 米/麵/粉</option><option value="零食">🍪 零食/餅乾</option><option value="調味料">🧂 調味料</option><option value="冷凍">❄️ 冷凍食品</option><option value="清潔日用">🧴 清潔/日用品</option><option value="其他">📦 其他</option>
          </select>
          <select id="shop" class="w-[110px] h-[44px] rounded-full border px-3 text-[13px] bg-white"><option>惠康</option><option>百佳</option><option>佳寶</option><option>759</option><option>Donki</option><option>HKTVmall</option><option>其他</option></select>
        </div>
        <div class="flex gap-2">
          <input id="price" type="number" inputmode="decimal" placeholder="價錢 $" class="flex-1 h-[44px] rounded-full border px-4 text-[14px] focus:outline-none focus:border-black">
          <input id="weight" type="number" inputmode="decimal" placeholder="重量" class="w-[80px] h-[44px] rounded-full border px-4 text-[14px] focus:outline-none focus:border-black">
          <select id="unit" class="w-[80px] h-[44px] rounded-full border px-3 text-[13px] bg-white"><option value="g">g</option><option value="kg">kg</option><option value="ml" selected>ml</option><option value="L">L</option><option value="件">件</option><option value="磅">磅</option><option value="斤">斤</option></select>
        </div>
        <!-- 3 photos -->
        <div class="grid grid-cols-3 gap-2">
          <label class="relative h-[84px] rounded-[16px] border-2 border-dashed border-neutral-200 bg-neutral-50 flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-black transition">
            <input id="file1" type="file" accept="image/*" capture="environment" class="hidden">
            <i class="fa-solid fa-box-open text-neutral-400 text-[14px]"></i><span class="text-[10px] text-neutral-600">貨品</span>
            <img id="preview1" class="hidden absolute inset-0 w-full h-full object-cover rounded-[14px]"><button id="remove1" class="hidden absolute -top-2 -right-2 w-6 h-6 rounded-full bg-black text-white text-[10px]">×</button>
          </label>

            <input id="file2" type="file" accept="image/*" capture="environment" class="hidden">
            <i class="fa-solid fa-tag text-neutral-400 text-[14px]"></i><span class="text-[10px] text-neutral-600">價錢牌</span>
            <img id="preview2" class="hidden absolute inset-0 w-full h-full object-cover rounded-[14px]"><button id="remove2" class="hidden absolute -top-2 -right-2 w-6 h-6 rounded-full bg-black text-white text-[10px]">×</button>
          </label>
          <label class="relative h-[84px] rounded-[16px] border-2 border-dashed border-orange-200 bg-orange-50 flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-orange-400 transition">
            <input id="file3" type="file" accept="image/*" capture="environment" class="hidden">
            <i class="fa-solid fa-clipboard-list text-orange-400 text-[14px]"></i><span class="text-[10px] text-orange-700">食物標籤</span>
            <img id="preview3" class="hidden absolute inset-0 w-full h-full object-cover rounded-[14px]"><button id="remove3" class="hidden absolute -top-2 -right-2 w-6 h-6 rounded-full bg-black text-white text-[10px]">×</button>

        <button id="addBtn" class="h-[48px] rounded-full bg-black text-white font-bold text-[14px] flex items-center justify-center gap-2"><i class="fa-solid fa-plus"></i> 儲存格價</button>
        <div class="text-[10px] text-neutral-400 text-center">支援3張相：貨品/價錢牌/食物標籤 · 點擊放大 · 一鍵再記同款</div>
      </div>
    </div>
    <div class="bg-black text-white md:rounded-[20px] rounded-[16px] mt-4 p-4"><div class="flex justify-between mb-2"><div class="text-[12px] font-bold">💹 每100g/ml走勢</div><div id="chartLabel" class="text-[10px] opacity-60">$/100ml</div></div><canvas id="chart" height="180" class="w-full"></canvas><div id="chartEmpty" class="h-[180px] flex items-center justify-center text-white/40 text-[11px]">未有數據</div></div>
  </div>

  <!-- Right List -->
  <div class="flex-1 mt-4 md:mt-0">
    <div class="flex gap-2 mb-3 overflow-x-auto scrollbar-hide">
      <input id="search" placeholder="🔍 搜產品名" class="h-[36px] rounded-full border bg-white px-4 text-[13px] min-w-[140px] focus:outline-none focus:border-black">
      <select id="filterCategory" class="h-[36px] rounded-full border bg-white px-3 text-[12px]"><option value="">全部種類</option><option value="飲品">🥤 飲品</option><option value="奶類">🥛 奶類</option><option value="罐頭醬料">🥫 罐頭</option><option value="米麵粉">🍚 米麵</option><option value="零食">🍪 零食</option><option value="調味料">🧂 調味</option><option value="冷凍">❄️ 冷凍</option><option value="清潔日用">🧴 清潔</option><option value="其他">📦 其他</option></select>
      <select id="filterShop" class="h-[36px] rounded-full border bg-white px-3 text-[12px]"><option value="">全部店舖</option><option>惠康</option><option>百佳</option><option>佳寶</option><option>759</option><option>Donki</option><option>HKTVmall</option><option>其他</option></select>
      <select id="sortBy" class="h-[36px] rounded-full border bg-white px-3 text-[12px]"><option value="new">最新</option><option value="cheap">最平</option><option value="expensive">最貴</option></select>

    <div id="list" class="grid md:grid-cols-2 gap-3"></div>
    <div id="tableView" class="hidden bg-white rounded-[16px] border overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-[12px]"><thead class="bg-neutral-50 text-neutral-500"><tr><th class="p-2 text-left">產品</th><th class="p-2">種類</th><th class="p-2">店</th><th class="p-2">價錢</th><th class="p-2">/100g</th><th class="p-2">相</th><th class="p-2"></th></tr></thead><tbody id="tableBody"></tbody></table></div></div>
    <div id="empty" class="py-20 text-center text-neutral-400 text-[13px]">未有紀錄，影張相開始格價啦</div>
  </div>
</div>

<button id="fab" class="md:hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-black text-white shadow-lg flex items-center justify-center text-[20px] z-20"><i class="fa-solid fa-plus"></i></button>

<!-- Lightbox -->
<div id="lightbox" class="fixed inset-0 z-[100] hidden bg-black/95 flex items-center justify-center">
  <button id="lbClose" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center text-[20px]">×</button>
  <button id="lbPrev" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 text-white"><i class="fa-solid fa-chevron-left"></i></button>
  <button id="lbNext" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 text-white"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="absolute top-4 left-4 bg-white/10 text-white text-[11px] px-2 py-1 rounded-full" id="lbLabel">貨品相</div>
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2"><button id="lbZoomOut" class="w-10 h-10 rounded-full bg-white/10 text-white">-</button><button id="lbZoomReset" class="w-12 h-10 rounded-full bg-white/10 text-white text-[11px]">100%</button><button id="lbZoomIn" class="w-10 h-10 rounded-full bg-white/10 text-white">+</button></div>
  <div id="lbDots" class="absolute bottom-20 left-1/2 -translate-x-1/2 flex gap-2"></div>
  <img id="lbImg" class="max-w-[90vw] max-h-[90vh] object-contain select-none touch-none" draggable="false" style="transition: transform 0.15s ease;">
</div>

<!-- Edit Modal -->
<div id="editModal" class="fixed inset-0 z-[90] hidden bg-black/50 backdrop-blur-sm p-4 flex items-end md:items-center justify-center">
  <div class="bg-white w-full max-w-[520px] rounded-t-[24px] md:rounded-[24px] p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4"><div class="font-bold text-[15px]">✏️ 編輯格價</div><button id="editClose" class="w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center">×</button></div>
    <div class="grid gap-3">
      <input id="editName" placeholder="產品名" class="h-[44px] rounded-full border px-4 text-[14px] focus:outline-none focus:border-black">
      <div class="flex gap-2"><select id="editCategory" class="flex-1 h-[44px] rounded-full border px-3 text-[13px] bg-white"><option value="">🏷️ 種類</option><option value="飲品">🥤 飲品</option><option value="奶類">🥛 奶類</option><option value="罐頭醬料">🥫 罐頭/醬料</option><option value="米麵粉">🍚 米/麵/粉</option><option value="零食">🍪 零食</option><option value="調味料">🧂 調味料</option><option value="冷凍">❄️ 冷凍</option><option value="清潔日用">🧴 清潔/日用品</option><option value="其他">📦 其他</option></select><select id="editShop" class="w-[110px] h-[44px] rounded-full border px-3 text-[13px] bg-white"><option>惠康</option><option>百佳</option><option>佳寶</option><option>759</option><option>Donki</option><option>HKTVmall</option><option>其他</option></select></div>
      <div class="flex gap-2"><input id="editPrice" type="number" placeholder="價錢" class="flex-1 h-[44px] rounded-full border px-4 text-[14px]"><input id="editWeight" type="number" placeholder="重量" class="w-[80px] h-[44px] rounded-full border px-4 text-[14px]"><select id="editUnit" class="w-[80px] h-[44px] rounded-full border px-3 text-[13px] bg-white"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="件">件</option><option value="磅">磅</option><option value="斤">斤</option></select></div>
      <div class="grid grid-cols-3 gap-2">
        <div class="relative"><img id="editPreview1" class="w-full h-[90px] rounded-[12px] object-cover bg-neutral-100"><label class="absolute bottom-1 left-1/2 -translate-x-1/2 bg-black text-white text-[9px] px-2 py-1 rounded-full cursor-pointer">更換<input id="editFile1" type="file" accept="image/*" class="hidden"></label><button id="editRemove1" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-[10px]">×</button><div class="text-[9px] text-center mt-1">貨品</div></div>
        <div class="relative"><img id="editPreview2" class="w-full h-[90px] rounded-[12px] object-cover bg-neutral-100"><label class="absolute bottom-1 left-1/2 -translate-x-1/2 bg-black text-white text-[9px] px-2 py-1 rounded-full cursor-pointer">更換<input id="editFile2" type="file" accept="image/*" class="hidden"></label><button id="editRemove2" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-[10px]">×</button><div class="text-[9px] text-center mt-1">價錢牌</div></div>
        <div class="relative"><img id="editPreview3" class="w-full h-[90px] rounded-[12px] object-cover bg-orange-50 border border-orange-200"><label class="absolute bottom-1 left-1/2 -translate-x-1/2 bg-orange-600 text-white text-[9px] px-2 py-1 rounded-full cursor-pointer">更換<input id="editFile3" type="file" accept="image/*" class="hidden"></label><button id="editRemove3" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-[10px]">×</button><div class="text-[9px] text-center mt-1 text-orange-600">食物標籤</div></div>
      </div>
      <button id="editSave" class="h-[48px] rounded-full bg-black text-white font-bold">儲存修改</button>
      <button id="editDelete" class="h-[44px] rounded-full border border-red-200 text-red-600 text-[13px]">🗑️ 刪除此紀錄</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[12px] px-4 py-2 rounded-full hidden z-[110]"></div>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from 'firebase/firestore';
const firebaseConfig = { apiKey: "AIzaSyDL9NrgQBYWqYhm2GF0_yBm6cyMJAEsEaM", authDomain: "hk-price.firebaseapp.com", projectId: "hk-price", storageBucket: "hk-price.firebasestorage.app", messagingSenderId: "798199927547", appId: "1:798199927547:web:28207610c68a1ab465d65e" };
let db, items=[]; let editingId=null; let temp={b64_1:null,b64_2:null,b64_3:null}; let editTemp={b64_1:null,b64_2:null,b64_3:null}; let lb={images:[],labels:[],index:0,scale:1,x:0,y:0,drag:false,sx:0,sy:0}; let viewMode='card';
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2400); }
function toG(w,u){ w=parseFloat(w)||1; if(u==='kg')return w*1000; if(u==='L')return w*1000; if(u==='磅')return w*454; if(u==='斤')return w*605; if(u==='件')return 1; return w; }
function per100(p,w,u){ return (p/(toG(w,u)||1))*100; }
function compress(f){ return new Promise(r=>{ const rd=new FileReader(); rd.onload=e=>{ const im=new Image(); im.onload=()=>{ let W=im.width,H=im.height; if(W>800){ H=H*800/W; W=800; } const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(im,0,0,W,H); r(c.toDataURL('image/jpeg',0.6)); }; im.src=e.target.result; }; rd.readAsDataURL(f); }); }
try{ const app=initializeApp(firebaseConfig); db=getFirestore(app); const q=query(collection(db,'prices'), orderBy('created_at','desc')); onSnapshot(q, s=>{ items=s.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('syncBadge').innerHTML=`✅ 已連動 (${items.length}筆)`; document.getElementById('syncBadge').className='text-[11px] px-2.5 py-1 rounded-full bg-green-50 border border-green-200 text-green-700'; document.getElementById('errorBanner').classList.add('hidden'); render(); }, err=>{ document.getElementById('syncBadge').innerHTML='❌ 規則未開放'; document.getElementById('syncBadge').className='text-[11px] px-2.5 py-1 rounded-full bg-red-50 border border-red-200 text-red-700'; document.getElementById('errorBanner').classList.remove('hidden'); }); }catch(e){ document.getElementById('syncBadge').textContent='📴 本機模式'; }

function render(){
  const s=document.getElementById('search').value.toLowerCase();
  const catF=document.getElementById('filterCategory').value;
  const shopF=document.getElementById('filterShop').value;
  const sort=document.getElementById('sortBy').value;
  let f=items.filter(it=>{
    if(s&&!it.product_name?.toLowerCase().includes(s)) return false;
    if(catF&&it.category!==catF) return false;
    if(shopF&&it.shop!==shopF) return false;
    return true;
  });
  if(sort==='cheap')f.sort((a,b)=>(a.price_per_100g||999)-(b.price_per_100g||999));
  if(sort==='expensive')f.sort((a,b)=>(b.price_per_100g||0)-(a.price_per_100g||0));
  const list=document.getElementById('list'); const emp=document.getElementById('empty');
  if(!f.length){ list.innerHTML=''; emp.classList.remove('hidden'); drawChart([]); return; }
  emp.classList.add('hidden');
  if(viewMode==='card'){
    document.getElementById('tableView').classList.add('hidden'); list.classList.remove('hidden');
    list.innerHTML=f.map(it=>{
      const p=it.price_per_100g||per100(it.price,it.weight,it.unit);
      const isV=it.unit==='ml'||it.unit==='L'; const lb=isV?'/100ml':'/100g';
      const catIcon={'飲品':'🥤','奶類':'🥛','罐頭醬料':'🥫','米麵粉':'🍚','零食':'🍪','調味料':'🧂','冷凍':'❄️','清潔日用':'🧴','其他':'📦'}[it.category]||'🏷️';
      const shopColor={'惠康':'bg-[#00A651]','百佳':'bg-[#E30613]','佳寶':'bg-[#FFD400] text-black','759':'bg-black','Donki':'bg-[#E60012]','HKTVmall':'bg-[#FF6600]'}[it.shop]||'bg-neutral-800';
      const imgCount=[it.image1,it.image2,it.image3].filter(Boolean).length;
      return `<div class="bg-white rounded-[16px] border p-3 flex gap-3 hover:shadow-md transition">
        <div class="flex flex-col gap-1 shrink-0">
          <div class="flex gap-1">
            ${it.image1?`<img src="${it.image1}" data-full="${it.image1}" data-group="${it.id}" class="w-[56px] h-[56px] rounded-[10px] object-cover cursor-zoom-in border photo">`:`<div class="w-[56px] h-[56px] rounded-[10px] bg-neutral-100 flex items-center justify-center text-neutral-300 text-[12px]">📷</div>`}
            <div class="flex flex-col gap-1">
              ${it.image2?`<img src="${it.image2}" data-full="${it.image2}" data-group="${it.id}" class="w-[24px] h-[26px] rounded-[6px] object-cover cursor-zoom-in border photo">`:`<div class="w-[24px] h-[26px] rounded-[6px] bg-neutral-50"></div>`}
              ${it.image3?`<img src="${it.image3}" data-full="${it.image3}" data-group="${it.id}" class="w-[24px] h-[26px] rounded-[6px] object-cover cursor-zoom-in border-2 border-orange-200 photo">`:`<div class="w-[24px] h-[26px] rounded-[6px] bg-orange-50 border border-dashed border-orange-200"></div>`}
            </div>
          </div>
          <div class="text-[8px] text-neutral-400 text-center">${imgCount}/3張</div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div class="font-bold text-[13px] md:text-[14px] leading-tight truncate">${it.product_name||'未命名'}</div>
            <div class="flex gap-1 shrink-0">
              <button data-clone="${it.id}" class="cloneBtn w-7 h-7 rounded-full bg-[#FFCA28] border border-yellow-400 flex items-center justify-center hover:bg-yellow-400" title="再記同款"><i class="fa-solid fa-copy text-[10px]"></i></button>
              <button data-edit="${it.id}" class="editBtn w-7 h-7 rounded-full bg-neutral-50 border flex items-center justify-center hover:bg-black hover:text-white"><i class="fa-solid fa-pen text-[10px]"></i></button>
            </div>
          </div>
          <div class="flex items-center gap-1.5 mt-1 flex-wrap">
            ${it.category?`<span class="text-[10px] px-2 py-0.5 rounded-full bg-neutral-100 border">${catIcon} ${it.category}</span>`:''}
            <span class="text-[10px] px-2 py-0.5 rounded-full text-white ${shopColor}">${it.shop||'其他'}</span>
            <span class="text-[9px] text-neutral-400">${it.weight||''}${it.unit||''}</span>
          </div>
          <div class="flex items-end justify-between mt-2">
            <div><span class="text-[16px] md:text-[18px] font-black">$${Number(it.price).toFixed(2)}</span></div>
            <div class="text-right"><div class="text-[11px] font-bold ${p<5?'text-green-600':'text-neutral-900'}">$${p.toFixed(2)}${lb}</div><div class="text-[8px] text-neutral-400">再記同款 → 點🔁</div></div>
          </div>
        </div>
      </div>`;
    }).join('');
  } else {
    list.classList.add('hidden'); document.getElementById('tableView').classList.remove('hidden');
    document.getElementById('tableBody').innerHTML=f.map(it=>{
      const p=it.price_per_100g||per100(it.price,it.weight,it.unit);
      return `<tr class="border-b hover:bg-neutral-50"><td class="p-2 font-bold truncate max-w-[140px]">${it.product_name}</td><td class="p-2">${it.category||'-'}</td><td class="p-2"><span class="px-2 py-0.5 rounded-full bg-neutral-800 text-white text-[10px]">${it.shop}</span></td><td class="p-2">$${it.price}</td><td class="p-2">$${p.toFixed(2)}</td><td class="p-2 flex gap-1">${it.image1?`<img src="${it.image1}" data-full="${it.image1}" class="w-8 h-8 rounded object-cover photo">`:''}${it.image3?`<span class="text-[10px] bg-orange-100 px-1 rounded">標籤</span>`:''}</td><td class="p-2 flex gap-1"><button data-clone="${it.id}" class="cloneBtn w-6 h-6 rounded-full bg-[#FFCA28]"><i class="fa-solid fa-copy text-[9px]"></i></button><button data-edit="${it.id}" class="editBtn w-6 h-6 rounded-full bg-neutral-100 border"><i class="fa-solid fa-pen text-[9px]"></i></button></td></tr>`;
    }).join('');
  }
  document.querySelectorAll('.editBtn').forEach(b=>b.addEventListener('click', e=>openEdit(e.currentTarget.dataset.edit)));
  document.querySelectorAll('.cloneBtn').forEach(b=>b.addEventListener('click', e=>cloneItem(e.currentTarget.dataset.clone)));
  document.querySelectorAll('.photo').forEach(im=>im.addEventListener('click', e=>openLb(e.currentTarget.dataset.full, e.currentTarget.dataset.group)));
  drawChart(f.slice(0,20).reverse());
}

function drawChart(data){
  const canvas=document.getElementById('chart'); const empty=document.getElementById('chartEmpty');
  if(!data.length){ canvas.classList.add('hidden'); empty.classList.remove('hidden'); return; }
  canvas.classList.remove('hidden'); empty.classList.add('hidden');
  const ctx=canvas.getContext('2d'); const w=canvas.width=canvas.offsetWidth*2; const h=canvas.height=180*2; ctx.clearRect(0,0,w,h);
  const vals=data.map(d=>d.price_per_100g!=null?d.price_per_100g:per100(d.price,d.weight,d.unit)).filter(v=>isFinite(v)); if(!vals.length)return;
  const min=Math.min(...vals)*0.85, max=Math.max(...vals)*1.15||10; const range=max-min||1;
  const isVol=data[0]?.unit==='ml'||data[0]?.unit==='L'; document.getElementById('chartLabel').textContent=isVol?'$/100ml':'$/100g';
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.setLineDash([8,8]); for(let i=0;i<4;i++){ const y=20+i/3*(h-40); ctx.beginPath(); ctx.moveTo(80,y); ctx.lineTo(w-20,y); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='20px sans-serif'; ctx.fillText(`$${(max-i/3*range).toFixed(1)}`,10,y+6); } ctx.setLineDash([]);
  ctx.strokeStyle='#00C853'; ctx.lineWidth=4; ctx.beginPath(); data.forEach((d,i)=>{ const v=vals[i]; const x=80+i/(data.length-1||1)*(w-100); const y=20+(1-(v-min)/range)*(h-40); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke();
  data.forEach((d,i)=>{ const v=vals[i]; const x=80+i/(data.length-1||1)*(w-100); const y=20+(1-(v-min)/range)*(h-40); const color={'惠康':'#00A651','百佳':'#E30613'}[d.shop]||'#fff'; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill(); });
}

// Clone function - 一鍵再記同款
function cloneItem(id){
  const it=items.find(x=>x.id===id); if(!it)return;
  document.getElementById('productName').value=it.product_name||'';
  document.getElementById('category').value=it.category||'';
  document.getElementById('weight').value=it.weight||'';
  document.getElementById('unit').value=it.unit||'g';
  document.getElementById('shop').value=it.shop||'其他';
  // keep price empty for new price, but copy images and category
  document.getElementById('price').value='';
  temp={b64_1:it.image1||null, b64_2:it.image2||null, b64_3:it.image3||null};
  if(temp.b64_1){ document.getElementById('preview1').src=temp.b64_1; document.getElementById('preview1').classList.remove('hidden'); document.getElementById('remove1').classList.remove('hidden'); }
  if(temp.b64_2){ document.getElementById('preview2').src=temp.b64_2; document.getElementById('preview2').classList.remove('hidden'); document.getElementById('remove2').classList.remove('hidden'); }
  if(temp.b64_3){ document.getElementById('preview3').src=temp.b64_3; document.getElementById('preview3').classList.remove('hidden'); document.getElementById('remove3').classList.remove('hidden'); }
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('price').focus();
  toast(`🔁 已複製 ${it.product_name} · 改價錢再儲存即可`);
}

async function handleAdd(){
  const name=document.getElementById('productName').value.trim();
  const price=parseFloat(document.getElementById('price').value);
  const weight=parseFloat(document.getElementById('weight').value)||1;
  const unit=document.getElementById('unit').value;
  const shop=document.getElementById('shop').value;
  const category=document.getElementById('category').value;
  if(!name||!price){ toast('請填產品名同價錢'); return; }
  const data={product_name:name, price, weight, unit, weight_g:toG(weight,unit), price_per_100g:per100(price,weight,unit), shop, category, created_at:serverTimestamp(), image1:temp.b64_1||'', image2:temp.b64_2||'', image3:temp.b64_3||''};
  const btn=document.getElementById('addBtn'); btn.innerHTML='儲存中...'; btn.disabled=true;
  try{
    if(db){
      try{ await addDoc(collection(db,'prices'), data); }
      catch(e){ if(e.message.includes('larger')){ await addDoc(collection(db,'prices'), {...data,image1:'',image2:'',image3:''}); toast('⚠️ 相片太大，已只同步文字'); } else throw e; }
    }
    document.getElementById('productName').value=''; document.getElementById('price').value=''; document.getElementById('weight').value=''; document.getElementById('category').value='';
    temp={b64_1:null,b64_2:null,b64_3:null};
    ['preview1','preview2','preview3','remove1','remove2','remove3'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    document.getElementById('file1').value=''; document.getElementById('file2').value=''; document.getElementById('file3').value='';
    toast('✅ 已儲存並同步');
  }catch(e){ toast('❌ '+e.message); }
  btn.innerHTML='<i class="fa-solid fa-plus"></i> 儲存格價'; btn.disabled=false;
}
document.getElementById('addBtn').addEventListener('click', handleAdd);
document.getElementById('search').addEventListener('input', render);
document.getElementById('filterCategory').addEventListener('change', render);
document.getElementById('filterShop').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
document.getElementById('viewToggle').addEventListener('click', ()=>{ viewMode=viewMode==='card'?'table':'card'; render(); });
document.getElementById('fab').addEventListener('click', ()=>{ document.getElementById('productName').focus(); window.scrollTo({top:0,behavior:'smooth'}); });
async function handleFile(inp, prev, rem, key){ const f=inp.files[0]; if(!f)return; const b=await compress(f); temp['b64_'+key]=b; document.getElementById(prev).src=b; document.getElementById(prev).classList.remove('hidden'); document.getElementById(rem).classList.remove('hidden'); }
document.getElementById('file1').addEventListener('change', e=>handleFile(e.target,'preview1','remove1','1'));
document.getElementById('file2').addEventListener('change', e=>handleFile(e.target,'preview2','remove2','2'));
document.getElementById('file3').addEventListener('change', e=>handleFile(e.target,'preview3','remove3','3'));
document.getElementById('remove1').addEventListener('click', e=>{ e.preventDefault(); temp.b64_1=null; document.getElementById('preview1').classList.add('hidden'); e.currentTarget.classList.add('hidden'); document.getElementById('file1').value=''; });
document.getElementById('remove2').addEventListener('click', e=>{ e.preventDefault(); temp.b64_2=null; document.getElementById('preview2').classList.add('hidden'); e.currentTarget.classList.add('hidden'); document.getElementById('file2').value=''; });
document.getElementById('remove3').addEventListener('click', e=>{ e.preventDefault(); temp.b64_3=null; document.getElementById('preview3').classList.add('hidden'); e.currentTarget.classList.add('hidden'); document.getElementById('file3').value=''; });

function openEdit(id){ const it=items.find(x=>x.id===id); if(!it)return; editingId=id; document.getElementById('editName').value=it.product_name||''; document.getElementById('editPrice').value=it.price||''; document.getElementById('editWeight').value=it.weight||''; document.getElementById('editUnit').value=it.unit||'g'; document.getElementById('editShop').value=it.shop||'其他'; document.getElementById('editCategory').value=it.category||''; document.getElementById('editPreview1').src=it.image1||''; document.getElementById('editPreview2').src=it.image2||''; document.getElementById('editPreview3').src=it.image3||''; editTemp={b64_1:it.image1||'',b64_2:it.image2||'',b64_3:it.image3||''}; document.getElementById('editModal').classList.remove('hidden'); }
document.getElementById('editClose').addEventListener('click', ()=>document.getElementById('editModal').classList.add('hidden'));
document.getElementById('editModal').addEventListener('click', e=>{ if(e.target.id==='editModal') e.currentTarget.classList.add('hidden'); });
document.getElementById('editFile1').addEventListener('change', async e=>{ const b=await compress(e.target.files[0]); editTemp.b64_1=b; document.getElementById('editPreview1').src=b; });
document.getElementById('editFile2').addEventListener('change', async e=>{ const b=await compress(e.target.files[0]); editTemp.b64_2=b; document.getElementById('editPreview2').src=b; });
document.getElementById('editFile3').addEventListener('change', async e=>{ const b=await compress(e.target.files[0]); editTemp.b64_3=b; document.getElementById('editPreview3').src=b; });
document.getElementById('editRemove1').addEventListener('click', ()=>{ editTemp.b64_1=''; document.getElementById('editPreview1').src=''; });
document.getElementById('editRemove2').addEventListener('click', ()=>{ editTemp.b64_2=''; document.getElementById('editPreview2').src=''; });
document.getElementById('editRemove3').addEventListener('click', ()=>{ editTemp.b64_3=''; document.getElementById('editPreview3').src=''; });
document.getElementById('editSave').addEventListener('click', async()=>{ const n=document.getElementById('editName').value.trim(); const p=parseFloat(document.getElementById('editPrice').value); const w=parseFloat(document.getElementById('editWeight').value)||1; const u=document.getElementById('editUnit').value; const sh=document.getElementById('editShop').value; const cat=document.getElementById('editCategory').value; const upd={product_name:n, price:p, weight:w, unit:u, weight_g:toG(w,u), price_per_100g:per100(p,w,u), shop:sh, category:cat, image1:editTemp.b64_1, image2:editTemp.b64_2, image3:editTemp.b64_3}; await updateDoc(doc(db,'prices',editingId), upd); document.getElementById('editModal').classList.add('hidden'); toast('✅ 已更新'); });
document.getElementById('editDelete').addEventListener('click', async()=>{ if(!confirm('確定刪除？'))return; await deleteDoc(doc(db,'prices',editingId)); document.getElementById('editModal').classList.add('hidden'); toast('🗑️ 已刪除'); });

function openLb(src,gid){ const g=items.find(x=>x.id===gid); let imgs=[]; let labels=[]; if(g){ if(g.image1){ imgs.push(g.image1); labels.push('貨品相'); } if(g.image2){ imgs.push(g.image2); labels.push('價錢牌'); } if(g.image3){ imgs.push(g.image3); labels.push('食物標籤'); } } if(!imgs.length)imgs=[src]; lb.images=imgs; lb.labels=labels; lb.index=imgs.indexOf(src); if(lb.index<0)lb.index=0; lb.scale=1; lb.x=0; lb.y=0; document.getElementById('lightbox').classList.remove('hidden'); document.body.style.overflow='hidden'; showLb(); }
function showLb(){ const im=document.getElementById('lbImg'); im.src=lb.images[lb.index]; document.getElementById('lbLabel').textContent=lb.labels[lb.index]||`相片 ${lb.index+1}/${lb.images.length}`; im.style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.scale})`; document.getElementById('lbDots').innerHTML=lb.images.map((_,i)=>`<div class="w-2 h-2 rounded-full ${i===lb.index?'bg-white':'bg-white/40'}"></div>`).join(''); }
function closeLb(){ document.getElementById('lightbox').classList.add('hidden'); document.body.style.overflow=''; }
document.getElementById('lbClose').addEventListener('click', closeLb); document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox')closeLb(); }); document.getElementById('lbPrev').addEventListener('click', ()=>{ lb.index=(lb.index-1+lb.images.length)%lb.images.length; lb.scale=1; lb.x=0; lb.y=0; showLb(); }); document.getElementById('lbNext').addEventListener('click', ()=>{ lb.index=(lb.index+1)%lb.images.length; lb.scale=1; lb.x=0; lb.y=0; showLb(); }); document.getElementById('lbZoomIn').addEventListener('click', ()=>{ lb.scale=Math.min(lb.scale*1.4,5); document.getElementById('lbImg').style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.scale})`; }); document.getElementById('lbZoomOut').addEventListener('click', ()=>{ lb.scale=Math.max(lb.scale/1.4,0.5); document.getElementById('lbImg').style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.scale})`; }); document.getElementById('lbZoomReset').addEventListener('click', ()=>{ lb.scale=1; lb.x=0; lb.y=0; document.getElementById('lbImg').style.transform=`translate(0,0) scale(1)`; });
const lbImg=document.getElementById('lbImg'); lbImg.addEventListener('pointerdown', e=>{ lb.drag=true; lb.sx=e.clientX-lb.x; lb.sy=e.clientY-lb.y; lbImg.setPointerCapture(e.pointerId); }); lbImg.addEventListener('pointermove', e=>{ if(!lb.drag||lb.scale<=1)return; lb.x=e.clientX-lb.sx; lb.y=e.clientY-lb.sy; lbImg.style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.scale})`; }); lbImg.addEventListener('pointerup', ()=>{ lb.drag=false; }); lbImg.addEventListener('wheel', e=>{ e.preventDefault(); lb.scale=Math.min(Math.max(lb.scale*(e.deltaY>0?0.9:1.1),0.5),5); lbImg.style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.scale})`; }, {passive:false});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeLb(); document.getElementById('editModal').classList.add('hidden'); } });
</script>
