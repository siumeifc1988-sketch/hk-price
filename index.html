// Cloudflare Pages Functions - Workers Runtime
export async function onRequestPost(context: { request: Request, env: any }) {
  const { GEMINI_API_KEY } = context.env;
  const { productImageBase64, priceImageBase64 } = await context.request.json() as any;

  if (!GEMINI_API_KEY) {
    return Response.json({ error: 'Missing GEMINI_API_KEY' }, { status: 500 });
  }

  const prompt = \`
你是超市貨品辨識助手。請分析兩張圖：
1. 商品圖：辨識品牌、品名、規格
2. 價格牌圖：辨識價格、單位、特價資訊

規則：
- 回傳 JSON，唔肯定=待確認，唔好估
- price 轉做 number
- 格式：{ product_name, brand, size, price, original_price, unit, confidence }
\`;

  const res = await fetch(
    \`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=\${GEMINI_API_KEY}\`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: 'image/jpeg', data: productImageBase64 } },
            { inline_data: { mime_type: 'image/jpeg', data: priceImageBase64 } }
          ]
        }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    }
  );

  const data = await res.json() as any;
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
  return Response.json(JSON.parse(text));
}

        '來源': { select: { name: body.source || 'Cloudflare Pages' } }

  });

  return Response.json(data, { status: res.status });
